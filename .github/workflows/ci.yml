name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Lint extension
        run: npm run lint:webext

      - name: Build XPI
        run: npm run build:xpi

      - name: Upload XPI
        uses: actions/upload-artifact@v7
        with:
          name: reply-with-meeting-xpi
          path: dist/*.xpi
          if-no-files-found: error
