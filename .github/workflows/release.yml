name: Build and Release XPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check tag matches manifest version
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [[ "${GITHUB_REF_NAME}" != "v${MANIFEST_VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version ${MANIFEST_VERSION} (expected v${MANIFEST_VERSION})"
            exit 1
          fi

      - name: Check version sync
        run: npm run version:check

      - name: Run tests
        run: npm test

      - name: Lint extension
        run: npm run lint:webext

      - name: Build XPI
        run: npm run build:xpi

      - name: Upload GitHub release asset
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.xpi
            dist/updates.json
          fail_on_unmatched_files: true
          generate_release_notes: true
          # Pick "latest" by version and date instead of whichever release
          # finishes last when several tags are pushed together.
          make_latest: legacy
